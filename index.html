r ago. Kaito wants answers - and the masked Warlord moves exactly the way Raiden taught him.",chapters:["The relay hums back to life. In the static, Kaito hears his master's old code phrase.","The stolen blade bears Raiden's crest. Whoever took it knew the vault's secrets.",'A freed captive whispers: "Raiden... he is not your enemy... not yet."',"In the shrine, Kaito finds his master's handwriting in the margins of the scroll.","Every guard here fights in Order stances. Someone is teaching them.","The beacon speaks in an Order cipher. The Warlord was once one of them.",'Launch codes in hand, Kaito finds a message waiting: "Come alone, my student."',"Master and student meet in the storm."],ending:"The Warlord's mask cracks: Raiden, consumed by the Core's whispers. Kaito frees him from its grip and takes his place as guardian of the Order. The city never learns who saved it - exactly as a shadow should."},build:{bulk:1,lean:0,stance:0},look:{primary:"#1a2238",accent:"#e0203f",glow:"#3ff6ff",mask:"full",accessory:"scarf"}},phantom:{id:"phantom",name:"PHANTOM",title:"The Speed Master",hp:130,speed:1.08,melee:.9,ranged:1,defense:.9,attackRate:1.3,rating:{hp:4,speed:10,attack:5,defense:4,special:8},special:{id:"lightning",name:"Lightning Dash",desc:"4 s: +30% speed, near-instant dash recharge, dashes shock enemies they pass.",duration:4,cooldown:18},skill:{id:"doublejump",name:"Double Jump",desc:"Jump again in mid-air. Fast consecutive attacks."},ultimate:{id:"thunder",name:"Thunder Rush",desc:"Lightning charge that tears through every enemy in a line.",cooldown:40},story:{name:"Aiko Hayase",origin:"The fastest courier in the lower city, rebuilt with cybernetic legs after a crash nobody else survived.",motive:'Her little brother Ren was taken by the Syndicate labs for "testing". She joined the Order to bring him home.',chapters:['Aiko outruns the rain. Somewhere below, Syndicate trucks carry new "volunteers".',"The drone line runs on stolen courier routes - her old routes.","Test subject 07 has her brother's face. He is alive, and he is here.","Ren left a trail of marks only she would recognise. He escaped... into the forest.",'A Syndicate log: "Subject 07 recaptured. Moved to the fortress."',"She finds Ren's jacket in the snow, next to the beacon that tracked him.","Ren's implant is wired to the launch codes. Saving him and stopping KAMI are the same mission.","Faster than the Warlord's blade. She has to be."],ending:"With the Core shattered, Ren's implant goes dark and he wakes up as himself again. Aiko trades her courier tags for the Order's mark - and teaches her brother to run."},build:{bulk:.9,lean:.12,stance:0},look:{primary:"#1d3a6e",accent:"#c9d6e8",glow:"#4fb8ff",mask:"visor",accessory:"headband"}},viper:{id:"viper",name:"VIPER",title:"The Tactical Hunter",hp:140,speed:1,melee:.95,ranged:1.3,defense:1,attackRate:1,rating:{hp:5,speed:6,attack:7,defense:6,special:8},special:{id:"sense",name:"Enhanced Detection",desc:"8 s: see every enemy, its vision cone and health through walls.",duration:8,cooldown:20},skill:{id:"energyshuriken",name:"Energy Shuriken",desc:"Starts with Energy Shuriken; +30% ranged damage and extra ammo."},ultimate:{id:"starfall",name:"Rain of Stars",desc:"Eight homing energy stars strike nearby enemies.",cooldown:40},story:{name:"Rin Kurosawa",origin:"Once the Syndicate's best tracker, she hunted Order agents for the Warlord.",motive:"When she saw KAMI's target list - her own home district on it - she defected with everything she knew.",chapters:["Rin knows every patrol route on these rooftops. She drew half of them.","Her old squad guards the factory. She would rather not meet them. She will.","The lab's encryption is her own design. She opens it like a diary.","The hounds were her hounds. They still know her scent. That helps - and it hurts.","The fortress commander was her mentor. He calls her traitor over the radio.","The beacon code contains her old access key. The Warlord wants her to find it.","Rin
